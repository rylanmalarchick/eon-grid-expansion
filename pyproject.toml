[project]
name = "eon-grid-expansion"
version = "0.0.1"
description = "Quantum-enhanced grid expansion planning for the 2026 EON challenge"
requires-python = ">=3.11"
dependencies = [
    "pandapower>=2.14",
    "matpowercaseframes>=2.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "highspy>=1.14",
    "pyqubo>=1.4",
    "dwave-neal>=0.6",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "qiskit-ibm-runtime>=0.30",
    "pennylane>=0.38",
    "quimb>=1.8",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.0",
]
gurobi = ["gurobipy>=11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE001", "TRY401", "ERA001", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
